# SIH 26016 — Phase 1 database foundation
# PostgreSQL 16 + PostGIS. All application data in this prototype is SYNTHETIC.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nlamp-postgres
    environment:
      POSTGRES_USER: nlamp
      POSTGRES_PASSWORD: nlamp
      POSTGRES_DB: nlamp
    ports:
      - "5433:5432"
    volumes:
      - nlamp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlamp -d nlamp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  nlamp_pgdata:
